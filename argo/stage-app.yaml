apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-stage
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/tamehr/chartwithsealed.git
    targetRevision: main
    path: envs/stage

  destination:
    server: https://kubernetes.default.svc
    namespace: stage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
